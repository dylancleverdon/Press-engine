[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "press-engine"
dynamic = ["version"]
description = "Personal CRM for finding, pitching and managing relationships with music press, curators and creators."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "trafilatura>=2.0",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "rapidfuzz>=3.9",
  "typer>=0.12",
  "google-auth>=2.30",
  "google-auth-oauthlib>=1.2",
  "tzdata",
  "tzlocal>=5.2",
]

[project.optional-dependencies]
anthropic = ["anthropic>=2.6"]
dev = ["pytest>=8", "httpx2"]

[project.scripts]
press-engine = "press_engine.cli:app"

[tool.setuptools.dynamic]
version = {attr = "press_engine.__version__"}

[tool.setuptools.packages.find]
include = ["press_engine*"]

[tool.setuptools.package-data]
press_engine = ["web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
