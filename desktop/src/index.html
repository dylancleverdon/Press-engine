<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Press Engine</title>
  <style>
    :root { --bg: #f7f7f5; --panel: #fff; --text: #1d1d1f; --muted: #6b6b72; --line: #e3e3e0; --accent: #2f5fd0; --bad: #b3261e; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #141416; --panel: #1d1d20; --text: #ececee; --muted: #9a9aa3; --line: #2e2e33; --accent: #7aa2ff; --bad: #ff8a80; }
    }
    html, body { height: 100%; margin: 0; }
    body { display: flex; align-items: center; justify-content: center; background: var(--bg); color: var(--text);
           font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; -webkit-user-select: none; user-select: none; }
    .card { width: min(560px, calc(100% - 48px)); background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 28px; text-align: center; }
    h1 { font-size: 20px; margin: 0 0 6px; }
    p { color: var(--muted); margin: 8px 0; }
    .spinner { width: 28px; height: 28px; margin: 18px auto 6px; border: 3px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    pre { text-align: left; max-height: 220px; overflow: auto; background: var(--bg); border-radius: 8px; padding: 10px; font-size: 11px; color: var(--muted); white-space: pre-wrap; -webkit-user-select: text; user-select: text; }
    .error { color: var(--bad); }
    button { margin: 6px 4px 0; padding: 8px 16px; border-radius: 8px; border: 1px solid var(--accent); background: var(--accent); color: #fff; font: inherit; cursor: pointer; }
    button.secondary { background: transparent; color: var(--accent); }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Press Engine</h1>
    <div id="busy">
      <div class="spinner" aria-hidden="true"></div>
      <p id="status" role="status">Starting…</p>
    </div>
    <div id="failed" hidden>
      <p class="error" id="error-message"></p>
      <pre id="error-log"></pre>
      <button id="retry">Try again</button>
      <button id="log" class="secondary">Open the full log</button>
    </div>
  </div>
  <script>
    const $ = (id) => document.getElementById(id);
    const invoke = (cmd) => window.__TAURI__ && window.__TAURI__.core.invoke(cmd);
    window.pressEngine = {
      show(mode, data) {
        const failed = mode === "error";
        $("busy").hidden = failed;
        $("failed").hidden = !failed;
        if (failed) {
          $("error-message").textContent = data.message || "Press Engine couldn't start.";
          $("error-log").textContent = data.log || "";
        } else {
          $("status").textContent = typeof data === "string" ? data : "Starting…";
        }
      },
    };
    try {
      const hash = decodeURIComponent(location.hash.slice(1));
      if (hash) {
        const state = JSON.parse(hash);
        window.pressEngine.show(state.mode, state.data);
      }
    } catch (e) { /* first load: keep the default text */ }
    $("retry").addEventListener("click", () => { window.pressEngine.show("status", "Trying again…"); invoke("retry"); });
    $("log").addEventListener("click", () => invoke("open_log"));
  </script>
</body>
</html>
